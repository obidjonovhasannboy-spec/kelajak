<html lang="uz">
<head>

<title>Yozyovon · Kelajak markazi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5F4;--ink:#0E2F33;--mut:#5B7A7D;--card:#fff;--line:#D3E3E1;--teal:#12857F;--sun:#F4A62A;--ok:#1E9A62;--warn:#B96F00;--bad:#B0284F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F24;--ink:#E4F0EE;--mut:#8FB0B2;--card:#12303A;--line:#23474F;--ok:#4FD393;--warn:#F4A62A;--bad:#FF7A9C}}
:root[data-theme="dark"]{--bg:#0B1F24;--ink:#E4F0EE;--mut:#8FB0B2;--card:#12303A;--line:#23474F;--ok:#4FD393;--warn:#F4A62A;--bad:#FF7A9C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3,.big{font-family:Unbounded,system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
.hero{position:relative;color:#fff;padding:28px 20px 44px;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.045) 14px 16px),linear-gradient(180deg,#0A2A30 0%,#0F6068 62%,#E9962A 135%);border-radius:0 0 28px 28px;overflow:hidden}
.hero .sm{opacity:.75;font-size:13px}
.hero h1{font-size:22px;line-height:1.2;margin-top:2px}
.arc{position:relative;margin:18px auto 0;max-width:340px}
.arc svg{width:100%;display:block;overflow:visible}
.arc .t{fill:none;stroke:rgba(255,255,255,.2);stroke-width:14;stroke-linecap:round}
.arc .g{fill:none;stroke:var(--sun);stroke-width:14;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.mid b{font:700 46px/1 Unbounded,sans-serif}
.mid i{font-style:normal;font-size:22px;opacity:.6}
.mid span{display:block;font-size:13px;opacity:.8;margin-top:4px}
.date{text-align:center;margin-top:14px;font-size:13px;opacity:.85}
.zig{position:absolute;left:0;right:0;bottom:0;height:12px;background:conic-gradient(from -45deg at bottom,#0000,var(--bg) 1deg 90deg,#0000 91deg) 50%/20px 100%}
.top{padding:22px 20px 6px}
.top h2{font-size:22px}
.top p{color:var(--mut);font-size:13px;margin-top:2px}
.sec{padding:0 16px;margin-top:20px}
.sec>h3{font-size:14px;margin:0 4px 10px}
.qa{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 0}
.qa button{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px}
.qa button:first-child{background:var(--sun);border-color:var(--sun);color:#2A1A00}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:20px}
.stats div{padding:14px 6px;text-align:center;border-left:1.5px solid var(--line)}
.stats div:first-child{border:0}
.stats b{display:block;font:700 24px/1.1 Unbounded,sans-serif}
.stats span{font-size:11px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.av{flex:none;width:42px;height:42px;border-radius:14px 14px 14px 4px;display:grid;place-items:center;font:700 13px Unbounded,sans-serif;background:var(--teal);color:#fff}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:15px}
.row .nm span{font-size:12px;color:var(--mut)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.keldi,.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.kech,.pill.wait{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.yoq,.pill.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.ann{border-left:5px solid var(--bad);border-radius:6px 16px 16px 6px}
.ann p{font-size:12px;color:var(--mut)}
.me{margin:16px;padding:18px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);text-align:center}
.me p{color:var(--mut);font-size:13px;margin:4px 0 14px}
.btn{display:inline-block;background:var(--sun);color:#2A1A00;font-weight:700;border-radius:999px;padding:13px 26px}
.btn.full{display:block;width:100%;margin-top:14px}
.btn:disabled{opacity:.6}
.seg{display:flex;gap:6px;padding:0 16px 12px}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:var(--card)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar em{flex:none;width:92px;font-style:normal}
.bar u{display:block;height:14px;border-radius:7px;text-decoration:none;min-width:6px;transition:width .8s}
.bar b{font-family:Unbounded,sans-serif;font-size:13px}
.act{display:flex;gap:6px;margin-top:8px}
.act button{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line)}
.sw{flex:none;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--teal)}
.sw.on::after{transform:translateX(20px)}
nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-top:1.5px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;font-size:12px;font-weight:700;color:var(--mut);padding-top:10px;position:relative}
nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;top:0;left:50%;width:22px;height:5px;margin-left:-11px;border-radius:3px;background:var(--sun)}
.sheet{position:fixed;inset:0;background:rgba(5,20,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.pnl{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.pnl h3{font-size:17px;margin-bottom:14px}
.pnl label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.pnl input,.pnl textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:700}
.chips button.on{background:var(--teal);border-color:var(--teal);color:#fff}
#toast{position:fixed;left:16px;right:16px;bottom:100px;max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

W=['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'],

staff:[
{n:'Siz (Direktor)',r:'Markaz direktori',s:'yoq',t:'',on:1},
{n:'Dilnoza Karimova',r:'Buxgalter',s:'keldi',t:'07:52',on:1},
{n:'Jasur Toshmatov',r:'Maktab maslahatchisi',s:'kech',t:'08:41',on:1},

const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),

function row(x){return `<div class="row"><div class="av">${e(ini(x.n))}</div><div class="nm"><b>${e(x.n)}</b><span>${e(x.r)}</span></div><span class="pill ${x.s}">${ST[x.s]}${x.t?' '+x.t:''}</span></div>`}
function home(){
const c=cnt(),tot=c.keldi+c.kech+c.yoq,n=c.keldi+c.kech,p=tot?n/tot:0,a=Math.PI*(1-p),x=150+125*Math.cos(a),y=150-125*Math.sin(a),d=new Date(),wait=S.rep.filter(r=>r.s==='wait').length;

<p class="date">${d.getDate()}-${M[d.getMonth()]}, ${W[d.getDay()]}</p><div class="zig"></div></header>
<div class="qa"><button data-a="ann">E'lon yuborish</button><button data-a="addst">Xodim qo'shish</button><button data-a="tab" data-v="att">Davomat</button></div>
<section class="sec"><div class="stats"><div><b style="color:var(--ok)">${c.keldi}</b><span>Kelgan</span></div><div><b style="color:var(--warn)">${c.kech}</b><span>Kechikkan</span></div><div><b style="color:var(--bad)">${c.yoq}</b><span>Kelmagan</span></div><div><b>${wait}</b><span>Hisobot kutmoqda</span></div></div></section>

const me=S.staff[0],l=S.staff.filter(x=>x.on&&(S.f==='all'||x.s===S.f));

function staff(){
return `<div class="top"><h2>Xodimlar</h2><p>${S.staff.filter(x=>x.on).length} faol xodim</p></div><div class="qa"><button data-a="addst">Yangi xodim qo'shish</button></div>
<section class="sec">${S.staff.map((x,i)=>i?`<div class="row"><div class="av">${e(ini(x.n))}</div><div class="nm"><b>${e(x.n)}</b><span>${e(x.r)}</span></div><button class="sw ${x.on?'on':''}" data-a="tg" data-v="${i}" aria-label="Faol holati"></button></div>`:'').join('')}</section>`}
function rep(){
const k={ok:0,wait:0,no:0};S.rep.forEach(r=>k[r.s]++);const mx=Math.max(1,...Object.values(k)),col={ok:'var(--ok)',wait:'var(--sun)',no:'var(--bad)'};

const V={home,att,staff,rep,me};
function render(){

const ACT={
tab(d){S.tab=d.v;scrollTo(0,0);render()},

addst(){S.pick='Markaz hodimi';sheet(`<h3>Yangi xodim</h3><label for="nn">Ism familiya</label><input id="nn" placeholder="Masalan: Aliyev Vali"><label for="ph">Telefon raqam</label><input id="ph" inputmode="tel" value="+998 "><label>Lavozim</label><div class="chips">${[`To'garak rahbari`,'Maktab maslahatchisi','Markaz hodimi'].map(r=>`<button data-a="rl" data-v="${r}" class="${r===S.pick?'on':''}">${r}</button>`).join('')}</div><button class="btn full" data-a="savest">Qo'shish</button>`)},
rl(d){document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b===d.el));S.pick=d.v},
savest(){const n=$('#nn').value.trim();if(n.length<3){toast('Ism familiyani yozing');return}const lg=n.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')+(100+Math.random()*899|0);S.staff.push({n,r:S.pick,s:'yoq',t:'',on:1});close();toast('Qo\'shildi. Login: '+lg);render()},
checkin(){const me=S.staff[0];if(S.busy||me.s!=='yoq')return;S.busy=1;render();setTimeout(()=>{const d=new Date(),late=d.getHours()*60+d.getMinutes()>500;me.s=late?'kech':'keldi';me.t=pad(d.getHours())+':'+pad(d.getMinutes());S.busy=0;toast(late?'Kech keldingiz: '+me.t:'Davomat belgilandi · markazdan '+(20+Math.random()*50|0)+' m');render()},1100)}};
document.addEventListener('click',ev=>{
if(ev.target.id==='sh'){close();return}
const a=ev.target.closest('[data-a]');if(!a)return;
const d=Object.assign({el:a},a.dataset);if(ACT[d.a])ACT[d.a](d)});

<script>
(()=>{
const day=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},
rad=x=>x*Math.PI/180,
hav=(a,b,c,d)=>{const h=Math.sin(rad(c-a)/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(rad(d-b)/2)**2;return 12742000*Math.asin(Math.sqrt(h))},
gps=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:20000,maximumAge:0}):no({code:0})),
ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?'Hozir':m<60?m+' daqiqa oldin':m<1440?(m/60|0)+' soat oldin':(m/1440|0)+' kun oldin'},

aerr=x=>/invalid|wrong|not-found/.test(x.code)?`Email yoki parol noto'g'ri`:x.code==='auth/email-already-in-use'?'Bu email band':x.code==='auth/weak-password'?'Parol kamida 6 belgi':x.code==='auth/invalid-email'?'Email noto\'g\'ri':(x.message||'Xatolik');
Object.assign(S,{staff:[],rep:[],ann:[],raw:[],att:{},cfg:null,me:null,admin:false,user:null,off:0,ld:1});
const merge=()=>{S.staff=S.raw.map(x=>{const a=S.att[x.id];return{id:x.id,n:x.name,r:x.role,on:x.active!==false,s:a?a.status:'yoq',t:a?a.time:''}})};
const or=V.rep,om=V.me,empty=t=>`<p style="color:var(--mut);padding:8px">${t}</p>`;
V.rep=()=>{let h=or();if(!S.admin)h=h.replace(/<div class="act">.*?<\/div>/g,'');return h.replace('</p></div>','</p></div>'+(S.me?`<div class="qa"><button data-a="newrep">Hisobot yuborish</button></div>`:''))};
V.me=()=>om()+(S.admin?`<section class="sec"><h3>Davomat joylashuvi</h3><div class="row"><div class="nm"><b>${S.cfg?'Belgilangan':'Belgilanmagan'}</b><span>${S.cfg?S.cfg.lat.toFixed(5)+', '+S.cfg.lng.toFixed(5)+' · '+S.cfg.r+' m':'Markazda turib belgilang'}</span></div></div><input id="rr" inputmode="numeric" aria-label="Radius metrda" value="${S.cfg?S.cfg.r:150}" style="width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:4px"><button class="btn full" data-a="setc">Shu yerni markaz qilish</button></section>`:'')+`<section class="sec"><button class="btn full" data-a="logout">Chiqish</button></section>`;
V.staff=()=>`<div class="top"><h2>Xodimlar</h2><p>${S.staff.filter(x=>x.on).length} faol xodim</p></div>${S.admin?`<div class="qa"><button data-a="addst">Yangi xodim qo'shish</button></div>`:''}<section class="sec">${S.staff.map((x,i)=>`<div class="row"><div class="av">${e(ini(x.n))}</div><div class="nm"><b>${e(x.n)}</b><span>${e(x.r)}</span></div>${S.admin?`<button class="sw ${x.on?'on':''}" data-a="tg" data-v="${i}" aria-label="Faol holati"></button>`:''}</div>`).join('')||empty(`Hali xodim qo'shilmagan.`)}</section>`;
V.att=()=>{const me=S.staff.find(x=>x.id===S.me),l=S.staff.filter(x=>x.on&&(S.f==='all'||x.s===S.f)),h3='class="big" style="font-size:17px"';let c;
if(!me)c=`<div class="me"><b ${h3}>Siz kimsiz?</b><p>Ismingizni tanlang. Keyingi safar so'ralmaydi.</p><div class="chips" style="justify-content:center">${S.staff.filter(x=>x.on).map(x=>`<button data-a="iam" data-v="${x.id}">${e(x.n)}</button>`).join('')||'<span style="color:var(--mut)">Avval direktor xodim qo\'shishi kerak.</span>'}</div></div>`;
else c=`<div class="me"><b ${h3}>${me.s==='yoq'?'Siz hali belgilanmagansiz':'Belgilandi: '+me.t}</b><p>${me.s==='yoq'?(S.cfg?`Markazdan ${S.cfg.r} m ichida bo'lishingiz kerak.`:'Direktor markaz joylashuvini belgilamagan.'):ST[me.s]}</p><button class="btn" data-a="checkin" ${S.busy||me.s!=='yoq'?'disabled':''}>${S.busy?'Joylashuv tekshirilmoqda...':`Davomatdan o'tish`}</button></div>`;
return `<div class="top"><h2>Davomat</h2><p>Kelish chegarasi 08:20</p></div>${c}<div class="seg">${[['all','Barchasi'],['keldi','Kelgan'],['kech','Kechikkan'],['yoq','Kelmagan']].map(f=>`<button class="${S.f===f[0]?'on':''}" data-a="flt" data-v="${f[0]}">${f[1]}</button>`).join('')}</div><section class="sec" style="margin-top:0">${l.map(row).join('')||empty(`Bu holatda xodim yo'q.`)}</section>`};
const login=()=>`<style>nav{display:none}</style><div class="top" style="padding-top:56px"><h2>Kelajak markazi</h2><p>Yozyovon tumani</p></div><section class="sec"><div class="pnl" style="border-radius:22px;max-width:none"><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Parol</label><input id="pw" type="password" autocomplete="current-password"><button class="btn full" data-a="login">Kirish</button><button class="btn full" style="background:none;border:1.5px solid var(--line);color:var(--ink)" data-a="signup">Ro'yxatdan o'tish</button><p style="font-size:12px;color:var(--mut);margin-top:10px">Birinchi ro'yxatdan o'tgan odam direktor bo'ladi.</p></div></section>`;
Object.keys(V).forEach(k=>{const f=V[k];V[k]=()=>S.off?`<style>nav{display:none}</style>`+empty(`Firebase sozlanmagan. Fayl boshidagi FB ga loyiha ma'lumotlarini kiriting.`):S.ld?`<p style="padding:60px;text-align:center">Yuklanmoqda...</p>`:S.user?f():login()});
const w=async(f,ok)=>{try{await f();if(ok)toast(ok)}catch(x){toast('Saqlanmadi: '+((x&&x.message)||''))}};
const ga=a=>d=>S.admin?a(d):toast('Bu amal faqat direktor uchun');
ACT.ann=ga(ACT.ann);ACT.addst=ga(ACT.addst);
let fs,auth;
ACT.login=()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(x=>toast(aerr(x)));
ACT.logout=()=>auth.signOut();
ACT.signup=async()=>{try{const u=(await auth.createUserWithEmailAndPassword($('#em').value.trim(),$('#pw').value)).user;if(!(await fs.doc('meta/init').get()).exists){const b=fs.batch();b.set(fs.doc('admins/'+u.uid),{at:Date.now()});b.set(fs.doc('meta/init'),{by:u.uid,at:Date.now()});await b.commit();toast('Siz direktor bo\'ldingiz')}}catch(x){toast(aerr(x))}};
ACT.sendann=()=>{const t=$('#at').value.trim();if(!t){toast(`E'lon matnini yozing`);return}w(()=>fs.collection('announcements').add({t,w:S.who||'Hamma xodimlarga',at:Date.now()}),`E'lon yuborildi`);S.who=0;close()};
ACT.savest=()=>{const n=$('#nn').value.trim();if(n.length<3){toast('Ism familiyani yozing');return}w(()=>fs.collection('staff').add({name:n,role:S.pick,phone:$('#ph').value.trim(),active:true,at:Date.now()}),`Xodim qo'shildi`);close()};
ACT.tg=d=>{const x=S.staff[d.v];w(()=>fs.doc('staff/'+x.id).update({active:!x.on}))};
ACT.rp=d=>{const r=S.rep[d.i];w(()=>fs.doc('reports/'+r.id).update({s:d.v}),d.v==='ok'?'Tasdiqlandi':'Rad etildi')};
ACT.iam=d=>w(()=>fs.doc('users/'+S.user.uid).set({staffId:d.v}));
ACT.newrep=()=>sheet(`<h3>Hisobot yuborish</h3><label for="rt">Hisobot nomi</label><input id="rt" placeholder="Masalan: Oktabr oyi hisoboti"><button class="btn full" data-a="savrep">Yuborish</button>`);
ACT.savrep=()=>{const t=$('#rt').value.trim(),me=S.staff.find(x=>x.id===S.me);if(!t||!me){toast('Hisobot nomini yozing');return}w(()=>fs.collection('reports').add({t,by:me.n,s:'wait',at:Date.now()}),'Hisobot yuborildi');close()};
ACT.setc=async()=>{try{toast('Joylashuv aniqlanmoqda...');const c=await gps();await fs.doc('settings/center').set({lat:c.latitude,lng:c.longitude,r:Math.max(30,+$('#rr').value||150)});toast('Markaz saqlandi (aniqlik '+Math.round(c.accuracy)+' m)')}catch(x){toast(gerr(x))}};
ACT.checkin=async()=>{const me=S.staff.find(x=>x.id===S.me);if(S.busy||!me||me.s!=='yoq')return;if(!S.cfg){toast('Direktor markaz joylashuvini belgilamagan');return}
S.busy=1;render();
try{const c=await gps(),m=Math.round(hav(c.latitude,c.longitude,S.cfg.lat,S.cfg.lng));
if(m>S.cfg.r+Math.min(c.accuracy||0,100))toast(`Markazdan ${m} m uzoqdasiz. ${S.cfg.r} m ichida bo'ling`);
else{const d=new Date(),late=d.getHours()*60+d.getMinutes()>500;await fs.doc('attendance/'+day()+'_'+me.id).set({uid:S.user.uid,staffId:me.id,day:day(),time:pad(d.getHours())+':'+pad(d.getMinutes()),status:late?'kech':'keldi',dist:m,at:Date.now()});toast(late?'Kech keldingiz':'Davomat belgilandi · markazdan '+m+' m')}}
catch(x){toast(gerr(x))}
S.busy=0;render()};
if(!FB.apiKey){S.off=1;render();return}
firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore();
const er=x=>toast('Baza xatosi: '+((x&&x.message)||'')),rows=s=>s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
let un=[];
auth.onAuthStateChanged(u=>{un.forEach(f=>f());un=[];S.user=u;S.ld=0;S.admin=false;S.me=null;
if(u){const L=(r,f)=>un.push(r.onSnapshot(f,er));
L(fs.doc('admins/'+u.uid),s=>{S.admin=s.exists;render()});
L(fs.doc('users/'+u.uid),s=>{S.me=s.exists?s.data().staffId:null;render()});
L(fs.collection('staff'),s=>{S.raw=rows(s).sort((a,b)=>a.name.localeCompare(b.name));merge();render()});
L(fs.collection('attendance').where('day','==',day()),s=>{S.att={};s.docs.forEach(d=>{const x=d.data();S.att[x.staffId]=x});merge();render()});
L(fs.collection('reports'),s=>{S.rep=rows(s);render()});
L(fs.collection('announcements'),s=>{S.ann=rows(s).slice(0,10).map(a=>({...a,d:ago(a.at)}));render()});
L(fs.doc('settings/center'),s=>{S.cfg=s.exists?s.data():null;render()})}
render()});
render();
})();
</script>
</body>
</html>
